{% set version = "1.3-0" %}
{% set posix = 'm2-' if win else '' %}

package:
  name: r-emulator
  version: {{ version|replace("-", "_") }}

source:
  url:
    - {{ cran_mirror }}/src/contrib/emulator_{{ version }}.tar.gz
    - {{ cran_mirror }}/src/contrib/Archive/emulator/emulator_{{ version }}.tar.gz
  sha256: 21c537340122b3d70c3b7c2d94d01c4aec728804ce9ba69b666394e9dee458c6

build:
  number: 0
  noarch: generic
  rpaths:
    - lib/R/lib/
    - lib/

requirements:
  build:
    - {{ posix }}zip               # [win]
    - cross-r-base {{ r_base }}    # [build_platform != target_platform]
  host:
    - r-base
    - r-mvtnorm
  run:
    - r-base
    - r-mvtnorm

test:
  commands:
    - $R -e "library('emulator')"           # [not win]
    - "\"%R%\" -e \"library('emulator')\""  # [win]

about:
  home: https://github.com/RobinHankin/emulator
  license: GPL-2.0-or-later
  summary: Allows one to estimate the output of a computer program, as a function of the input parameters, without actually running it. The computer program is assumed to be a Gaussian process, whose parameters are estimated using Bayesian techniques that give a PDF of expected program output.  This PDF is conditional 
    on a training set of runs, each consisting of a point in parameter space and the model output at that point.  The emphasis is on complex codes that take weeks or months to run, and that have a large number of undetermined input parameters; many climate prediction models fall into this class.  The emulator 
    essentially determines Bayesian posterior estimates of the PDF of the output of a model, conditioned on results from previous runs and a user-specified prior linear model.  The package includes functionality to evaluate quadratic forms efficiently.
  license_family: GPL3
  license_file:
    - {{ environ["PREFIX"] }}/lib/R/share/licenses/GPL-3

extra:
  recipe-maintainers:
    - conda-forge/r
